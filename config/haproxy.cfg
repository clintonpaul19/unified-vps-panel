global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

# Plain HTTP/WS and raw SSH multiplexing.
# /ssh uses the normal wstunnel endpoint. Other WebSocket upgrade payloads
# are accepted by the legacy payload bridge without changing their path.
frontend fe_http_ws_ssh
    mode tcp
    bind 0.0.0.0:80
    bind 0.0.0.0:8080
    bind 0.0.0.0:8880
    tcp-request inspect-delay 5s
    acl is_http req.proto_http
    acl is_websocket req.hdr(Upgrade) -i websocket
    acl has_connection_upgrade req.hdr(Connection) -m sub upgrade
    acl path_vless path_beg -i /vless
    acl path_vmess path_beg -i /vmess
    acl path_ssh path_beg -i /ssh
    tcp-request content switch-mode http if is_http
    use_backend be_vless_ws if path_vless is_websocket has_connection_upgrade
    use_backend be_vmess_ws if path_vmess is_websocket has_connection_upgrade
    use_backend be_ws_ssh if path_ssh is_websocket has_connection_upgrade
    use_backend be_ws_payload if is_websocket has_connection_upgrade
    use_backend be_http if is_http
    default_backend be_ssh

# TLS and raw SSH multiplexing.
# HAProxy does not terminate TLS here: Xray keeps control of the TLS
# certificate and protocol routing. Non-TLS traffic is sent to SSH.
frontend fe_tls_ssh
    mode tcp
    bind 0.0.0.0:443
    bind 0.0.0.0:8443
    tcp-request inspect-delay 5s
    acl is_tls req.ssl_hello_type 1
    tcp-request content accept if is_tls
    use_backend be_xray if is_tls
    default_backend be_ssh

backend be_vless_ws
    mode http
    option http-server-close
    timeout tunnel 1h
    server xray-vless 127.0.0.1:18444

backend be_vmess_ws
    mode http
    option http-server-close
    timeout tunnel 1h
    server xray-vmess 127.0.0.1:18445

backend be_ws_ssh
    mode http
    option http-server-close
    timeout tunnel 1h
    server wstunnel 127.0.0.1:18446

backend be_ws_payload
    mode http
    option http-server-close
    timeout tunnel 1h
    server payload-ssh 127.0.0.1:18447

backend be_http
    mode http
    option http-server-close
    server nginx 127.0.0.1:18080

backend be_ssh
    mode tcp
    server ssh 127.0.0.1:22

backend be_xray
    mode tcp
    server xray 127.0.0.1:18443

frontend fe_ssh_alt
    mode tcp
    bind 0.0.0.0:143
    default_backend be_ssh
