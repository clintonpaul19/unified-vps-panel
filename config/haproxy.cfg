global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

# Plain HTTP/WS and raw SSH multiplexing.
# Valid WebSocket upgrades go to wstunnel; ordinary HTTP goes to nginx;
# anything that is not HTTP is treated as raw SSH.
frontend fe_http_ws_ssh
    mode tcp
    bind 0.0.0.0:80
    bind 0.0.0.0:8080
    bind 0.0.0.0:8880
    tcp-request inspect-delay 5s
    acl is_http req.proto_http
    acl is_websocket req.hdr(Upgrade) -i websocket
    acl has_connection_upgrade req.hdr(Connection) -m sub upgrade
    use_backend be_ws_ssh if is_http is_websocket has_connection_upgrade
    use_backend be_http if is_http
    default_backend be_ssh

# TLS and raw SSH multiplexing.
# HAProxy does not terminate TLS here: Xray keeps control of the TLS
# certificate and protocol routing. Non-TLS traffic is sent to SSH.
frontend fe_tls_ssh
    mode tcp
    bind 0.0.0.0:443
    bind 0.0.0.0:8443
    tcp-request inspect-delay 5s
    acl is_tls req.ssl_hello_type 1
    use_backend be_xray if is_tls
    default_backend be_ssh

backend be_ws_ssh
    mode http
    option http-server-close
    timeout tunnel 1h
    # Normalize arbitrary HTTP/WS payload paths to the protected wstunnel path.
    http-request set-path /ssh
    server wstunnel 127.0.0.1:18446

backend be_http
    mode http
    option http-server-close
    server nginx 127.0.0.1:18080

backend be_ssh
    mode tcp
    server ssh 127.0.0.1:22

backend be_xray
    mode tcp
    server xray 127.0.0.1:18443

# SSH-only alternate port retained from the previous multiplexer.
frontend fe_ssh_alt
    mode tcp
    bind 0.0.0.0:143
    default_backend be_ssh
