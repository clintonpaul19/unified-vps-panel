apiVersion: v1
kind: Secret
metadata:
  name: unified-vps-api-secrets
  namespace: unified-vps
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/unified_vps"
  SESSION_SECRET: "REPLACE_WITH_32_PLUS_RANDOM_BYTES"
  BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_WITH_12_PLUS_CHARACTER_PASSWORD"
  BOOTSTRAP_TOKEN: "REPLACE_WITH_32_PLUS_RANDOM_BYTES"
