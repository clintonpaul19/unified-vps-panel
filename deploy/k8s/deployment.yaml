apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-vps-api
  namespace: unified-vps
  labels:
    app.kubernetes.io/name: unified-vps-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-vps-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-vps-api
    spec:
      serviceAccountName: unified-vps-api
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: unified-vps-api
      containers:
        - name: api
          image: ghcr.io/clintonpaul19/unified-vps-panel
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --proxy-headers
            - --timeout-graceful-shutdown
            - "20"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: unified-vps-api-config
            - secretRef:
                name: unified-vps-api-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
