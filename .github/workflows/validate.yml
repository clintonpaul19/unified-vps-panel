name: Validate Unified VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python panel
        run: python3 -m py_compile panel/app.py
      - name: Validate configuration files
        run: |
          python3 -m json.tool config/xray.json >/dev/null
      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/menu.sh
          bash -n scripts/unified-vps-watchdog.sh
          bash -n scripts/unified-vps-backup.sh
      - name: Validate systemd units
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd >/dev/null
          systemd-analyze verify systemd/unified-vps-watchdog.service systemd/unified-vps-watchdog.timer systemd/unified-vps-backup.service systemd/unified-vps-backup.timer systemd/unified-vps-ws-payload-ssh.service systemd/unified-vps-wstunnel-ssh.service
      - name: Validate HAProxy configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq haproxy >/dev/null
          haproxy -c -f config/haproxy.cfg
