name: Validate Unified VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python files
        run: |
          python3 -m py_compile panel/app.py panel/uvps_panel/*.py scripts/ws-payload-ssh.py platform/api/app/*.py platform/agent/agent.py
          PYTHONPATH="$PWD" python3 -c 'from panel.uvps_panel.main import main; from panel.uvps_panel.http import H; print("node panel import smoke test passed")'
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in (Path('panel/app.py'), *Path('panel/uvps_panel').glob('*.py'), Path('scripts/ws-payload-ssh.py'), *Path('platform/api/app').glob('*.py'), Path('platform/agent/agent.py')):
              ast.parse(open(p, encoding='utf-8').read(), filename=p)
          PY
      - name: Validate configuration files
        run: |
          python3 -m json.tool config/xray.json >/dev/null
      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/menu.sh
          bash -n scripts/unified-vps-watchdog.sh
          bash -n scripts/unified-vps-backup.sh
          bash -n scripts/unified-vps-cert-reload
          bash -n scripts/manage-user.sh
      - name: Shell static analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --severity=error install.sh scripts/menu.sh scripts/unified-vps-watchdog.sh scripts/unified-vps-backup.sh scripts/unified-vps-cert-reload scripts/manage-user.sh
      - name: Validate embedded browser JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          sources=[Path("panel/uvps_panel/views.py").read_text(encoding="utf-8")]
          src="\\n".join(sources)
          blocks=re.findall(r"<script[^>]*>(.*?)</script>", src, flags=re.S)
          if not blocks:
              raise SystemExit("No embedded JavaScript blocks found")
          for i,block in enumerate(blocks,1):
              Path(f"/tmp/panel-script-{i}.js").write_text(block, encoding="utf-8")
          print(f"Validated {len(blocks)} JavaScript blocks")
          PY
          for f in /tmp/panel-script-*.js; do node --check "$f"; done
      - name: Validate critical runtime invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("panel/app.py").read_text(encoding="utf-8")
          package=Path("panel/uvps_panel")
          menu=Path("scripts/menu.sh").read_text(encoding="utf-8")
          install=Path("install.sh").read_text(encoding="utf-8")
          assert len(app.splitlines()) < 60
          assert (package / "main.py").exists()
          assert (package / "http.py").exists()
          assert (package / "accounts.py").exists()
          auth=(package / "auth.py").read_text(encoding="utf-8")
          views=(package / "views.py").read_text(encoding="utf-8")
          assert "ADMIN_FILE" in auth and "_load_admin_credentials" in auth
          assert "Save and login" in views
          assert "hashlib.sha256" in auth
          assert "manage-user" in install
          assert "manage-user" in menu
          assert "spiderman" not in install.lower()
          assert "spiderman" not in app.lower()
          excluded = {'.git', '.github', '__pycache__'}
          for p in Path('.').rglob('*'):
              if any(part in excluded for part in p.parts):
                  continue
              if p.is_file() and b'\x00' in p.read_bytes():
                  raise SystemExit(f"NUL byte found in {p}")
          print("Critical runtime invariants passed")
          PY
      - name: Validate systemd units
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd >/dev/null
          sudo install -d /usr/local/sbin /usr/local/bin
          sudo touch /usr/local/sbin/unified-vps-watchdog /usr/local/sbin/unified-vps-backup /usr/local/bin/wstunnel /usr/local/bin/hysteria
          sudo chmod +x /usr/local/sbin/unified-vps-watchdog /usr/local/sbin/unified-vps-backup /usr/local/bin/wstunnel /usr/local/bin/hysteria
          systemd-analyze verify systemd/unified-vps-watchdog.service systemd/unified-vps-watchdog.timer systemd/unified-vps-backup.service systemd/unified-vps-backup.timer systemd/unified-vps-ws-payload-ssh.service systemd/unified-vps-wstunnel-ssh.service systemd/hysteria-server.service
      - name: Validate HAProxy configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq haproxy >/dev/null
          haproxy -c -f config/haproxy.cfg
