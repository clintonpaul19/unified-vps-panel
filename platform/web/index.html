<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unified VPS Control Plane</title>
<style>
:root{color-scheme:dark;--bg:#08110d;--card:#0e1b14;--line:#20362a;--muted:#9ab0a1;--ok:#4ade80;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#ecfdf3}
main{width:min(1100px,94vw);margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat{font-size:28px;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}button,input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#09150e;color:#ecfdf3}button{cursor:pointer;background:#153b26}form{display:grid;gap:10px;max-width:360px}.hidden{display:none}.pill{padding:3px 8px;border-radius:999px;border:1px solid var(--line)}.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head>
<body><main>
<div id="login" class="card"><h1>Unified VPS</h1><p class="sub">Control plane sign in</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginMsg" class="sub"></div></form></div>
<div id="app" class="hidden">
<div class="top"><div><h1>Unified VPS</h1><div class="sub" id="me"></div></div><div style="display:flex;gap:8px;align-items:center"><select id="orgSelect" style="display:none"></select><button id="logout">Sign out</button></div></div>
<div class="grid"><div class="card"><div class="sub">Servers</div><div class="stat" id="serverCount">0</div></div><div class="card"><div class="sub">Online</div><div class="stat" id="onlineCount">0</div></div></div>
<div class="card" style="margin-top:14px"><h2>Register server</h2><form id="serverForm"><input id="serverName" placeholder="Server name" maxlength="120" required><input id="serverHost" placeholder="Hostname"><input id="serverIp" placeholder="Public IPv4"><button>Register</button><div id="serverMsg" class="sub"></div></form></div><div class="card" style="margin-top:14px"><h2>Servers</h2><div id="servers"></div></div>
<div class="card" style="margin-top:14px"><h2>Recent events</h2><div id="events"></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
let activeOrgId="",loadGeneration=0;
async function api(path,opt={}){
 const headers={'Content-Type':'application/json',...(opt.headers||{})};
 if(activeOrgId)headers['X-Organization-ID']=activeOrgId;
 const r=await fetch(path,{...opt,headers});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||'Request failed');return j}
function showLogin(){ $('login').classList.remove('hidden');$('app').classList.add('hidden') }
async function load(){
 const generation=++loadGeneration;
 try{
  const me=await api('/v1/me'); if(generation!==loadGeneration)return; $('me').textContent=me.email;
  const orgs=await api('/v1/organizations');
  if(!orgs.length)throw new Error('No organization membership');
  if(!orgs.some(o=>o.id===activeOrgId))activeOrgId=orgs[0].id;
  const orgSelect=$('orgSelect'); orgSelect.innerHTML=orgs.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join(''); orgSelect.value=activeOrgId; orgSelect.style.display=orgs.length>1?'block':'none';
  const [servers,events]=await Promise.all([api('/v1/servers?include_metrics=false'),api('/v1/events')]);
  if(generation!==loadGeneration)return;
  $('serverCount').textContent=servers.length;$('onlineCount').textContent=servers.filter(s=>s.status==='online').length;
  $('servers').innerHTML=servers.length?servers.map(s=>'<div class="row"><div><b>'+esc(s.name)+'</b><div class="sub">'+esc(s.hostname||'No heartbeat yet')+'</div></div><span class="pill '+(s.status==='online'?'ok':'')+'">'+esc(s.status)+'</span></div>').join(''):'<div class="sub">No servers registered.</div>';
  $('events').innerHTML=events.length?events.map(e=>'<div class="row"><div><b>'+esc(e.event_type)+'</b><div class="sub">'+esc(JSON.stringify(e.metadata))+'</div></div><div class="sub">'+new Date(e.created_at).toLocaleString()+'</div></div>').join(''):'<div class="sub">No events.</div>';
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
 }catch(e){showLogin()}
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';try{await api('/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});await load()}catch(err){$('loginMsg').textContent=err.message}};
$('logout').onclick=async()=>{await api('/v1/auth/logout',{method:'POST'});showLogin()};
$('orgSelect').onchange=()=>{activeOrgId=$('orgSelect').value;load()};
$('serverForm').onsubmit=async e=>{e.preventDefault();$('serverMsg').textContent='';try{const r=await api('/v1/servers',{method:'POST',body:JSON.stringify({name:$('serverName').value,hostname:$('serverHost').value||null,public_ipv4:$('serverIp').value||null})});$('serverMsg').textContent='Registered. Save this node token now: '+r.node_token;$('serverForm').reset();await load()}catch(err){$('serverMsg').textContent=err.message}};
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script></body></html>
