[project]
name = "unified-vps-control-plane"
version = "0.1.0"
description = "Stateless FastAPI control plane for Unified VPS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23,<26",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
