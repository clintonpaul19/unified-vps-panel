[project]
name = "unified-vps-control-plane"
version = "0.4.0"
description = "Stateless FastAPI control plane for Unified VPS"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "asyncpg==0.32.0",
  "argon2-cffi>=25,<26",
  "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
